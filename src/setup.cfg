[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache
asyncio_mode=auto

[flake8]
ignore =
    D100,
    # Missing docstring in public module
    D101,
    # Missing docstring in public class
    D103,
    # Missing docstring in public function
    D104,
    # Missing docstring in public package
    B008,
    # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    WPS306,
    # Class without a base class
    WPS348,
    # Found a line that starts with a dot
    WPS111,
    # Found too short name
    D107,
    # Missing docstring in __init__
    D102,
    # Missing docstring in public method
    DAR101,
    # Missing parameter(s) in Docstring
    DAR201,
    # Missing "Returns" in Docstring
    E800,
    # Found commented out code
    WPS305,
    # Found `f` string
    W503,
    # Line break before binary operator
    WPS115,
    # Found upper-case constant in a class
    WPS600,
    # Found subclassing a builtin
    Q000,
    # Double quotes found but single quotes preferred
    WPS201,
    # Found module with too many imports
    WPS211,
    # Found too many arguments
    WPS300,
    # Found local folder import
    WPS404,
    # Found complex default value
    WPS229,
    # Found too long ``try`` body length
    WPS412,
    # Found `__init__.py` module with logic
    WPS420,
    # Found wrong keyword: pass
    WPS431,
    # Found nested class:
    WPS110,
    # Found wrong variable name
    D106,
    # Missing docstring in public nested class
    WPS226,
    # Found string constant over-use
    WPS237,
    # Found a too complex `f` string
    WPS221,
    # Found line with high Jones Complexity: 16 > 14
    WPS421,
    # Found wrong function call
    D,
    # Remove all docstring rules
    WPS601,
    # Found shadowed class attribute
    WPS602,
    # Found using `@staticmethod`
    WPS604,
    # Found incorrect node inside `class` body
    WPS410,
    # Found wrong metadata variable: __all__
    WPS609,
    # Found direct magic attribute usage: __all__
    F403,
    # used; unable to detect undefined names
    WPS347,
    # Found vague import that may cause confusion: *
    WPS440,
    # Found block variables overlap: *
    F405,
    WPS453,
    # Found executable mismatch: file is executable but no shebang is present
    WPS323,
    # Found `%` string formatting
    WPS33,
    # Found walrus operator
    WPS473,
    N818,
    WPS235,
    # Found too many imported names from a module
    WPS529,
    # Found negated condition
    WPS504,


exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
# There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_agentic_ai/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_agentic_ai/containers.py: WPS202, WPS203
    ./deps_agentic_ai/api/fastapi_auth.py: WPS430, WPS433
    ./deps_agentic_ai/extras/datasource/backoff.py: WPS232, WPS231, WPS430, WPS220
    ./deps_agentic_ai/infrastructure/repositories/tables/*.py: WPS432
    ./deps_agentic_ai/domain/model/shared/types_.py: WPS102
    ./deps_agentic_ai/api/serializers/v1/conversation/get_conversations.py: WPS202
    ./deps_agentic_ai/api/endpoints/v1/conversations.py: WPS202, WPS204
    ./deps_agentic_ai/api/serializers/internal/__init__.py: F401, WPS458
    ./deps_agentic_ai/infrastructure/repositories/conversation/conversation_query_factory.py: WPS214
    ./deps_agentic_ai/infrastructure/repositories/conversation/command_conversation_repository.py: WPS214, WPS204


max-local-variables = 15
max-methods = 10
max-line-length = 120

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
