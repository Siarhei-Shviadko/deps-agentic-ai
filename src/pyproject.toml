[tool.poetry]
name = "deps_agentic_ai"
version = "0.1.0"
description = "Chat with AI agents"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
dependency-injector = "~4.48.0"
pydantic = ">=2.0,<3.0"
pydantic-settings = "^2.0"
click = "^8.1.3"
asyncpg = "^0.30.0"
uvicorn = "^0.18.3"
fastapi = "^0.135.0"
SQLAlchemy = { version = "^2.0", extras = ["asyncio"] }
sse-starlette = "^2.3.5"
httpx = "^0.27.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
httpx-retries = "^0.4.5"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^7.3"
wemake-python-styleguide = "^1.2"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^8.4.0"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.25.6"
wdb = "^3.3.0"
requests-mock = "~1.9.3"
pytest-asyncio = "^0.21.2"
async-asgi-testclient = "^1.4.11"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''
