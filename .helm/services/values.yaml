secrets:
  deps_agentic_ai:
    secretName: deps-agentic-ai
  app_secret_key:
    secretName: app-secret-key
  agentic_ai_database:
    secretName: agentic-ai-database
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  common_secret:
    secretName: common-secret
  rabbitmq_password:
    secretName: rabbitmq-password
  security_certs:
    secretName: security-certs
  redis_password:
    secretName: redis-password
  kafka_secrets:
    secretName: kafka-secrets
  database_ssl_secret:
    secretName: database-ssl-secret
  telemetry_secrets:
    secretName: telemetry-secrets

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

registry: ""

agentic_ai:
  replicaCount: 1
  image:
    path: "/deps-dev-x01/deps-agentic-ai"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

agentic_ai_consumer:
  replicaCount: 1
  image:
    path: '/deps-dev-x01/deps-agentic-ai'
    pullPolicy: IfNotPresent
    tag: ''
  imagePullSecrets: artifactory
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

certs_location:
  certs_default_path: "/tmp/ssl"
  database_sslcerts_path: "/home/dbcerts"

agentic_ai_settings:
    ENV: dev

    DATABASE_PORT: '5432'
    DATABASE_DRIVER: asyncpg
    DATABASE_DIALECT: postgresql
    DATABASE_REQUIRE_SECURE_TRANSPORT: false
    DATABASE_SSLKEY_PATH: "/home/dbcerts/tls.key"
    DATABASE_SSLCERT_PATH: "/home/dbcerts/tls.crt"
    DATABASE_SSLROOTCERT_PATH: "/home/dbcerts/root.crt"

    AUTH_VERIFY_SSL: false

    LOG_LEVEL: "INFO"
    DOCUMENTATION_ENABLED: "true"

    RABBITMQ_TLS_ENABLED: false

    KAFKA_GROUP_ID: agentic-ai
    KAFKA_AUTO_OFFSET_RESET: earliest
    KAFKA_SECURITY_ENABLED: false

    # Azure Service Bus
    ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'

    # Telemetry
    INSTRUMENTATION_ENABLED: false
    SERVICE_NAME: agentic-ai
    EXPORTER_TYPE: azure

helm:
  helm_logs_job_enabled: false

message_broker_asb_without_manage_permission:
  enabled: false

csi:
  csi_default_name: deps-agentic-ai
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

# Enabled vault settings means that secrets are pulled from hashicorp vault server.
vault_settings:
  enabled: false

agentic_ai_vault_enabled:
  env:
    - name: AUTH_CERTS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: keycloak-certs-endpoint
    - name: MESSAGING_DRIVER
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: message-broker-driver
    - name: MESSAGE_BROKER_CONNECTION_STRING
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: message-broker-connection-string
    - name: DATABASE_HOST
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: database-host
    - name: DATABASE_DB
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: database-db
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: user
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: deps-agentic-ai
          key: password

agentic_ai_vault_disabled:
  env:
    - name: AUTH_CERTS_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: keycloak-certs-endpoint
          key: keycloak-certs-endpoint
    - name: MESSAGING_DRIVER
