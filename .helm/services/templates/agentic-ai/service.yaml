apiVersion: v1
kind: Service
metadata:
  name: agentic-ai
  labels:
    {{- include "deps-agentic-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agentic_ai.service.type }}
  ports:
    - port: {{ .Values.agentic_ai.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-agentic-ai.selectorLabels" . | nindent 4 }}
