agentic_ai:
  image:
    path: "/deps-platform/deps-agentic-ai"
  resources: {}


agentic_ai_settings:
  ENV: demo

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false


migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false


agentic_ai_consumer:
  image:
    path: "/deps-platform/deps-agentic-ai"


migrator:
  image:
    path: "/deps-platform/deps-agentic-ai-migrator"


helm:
  helm_logs_job_enabled: false


csi:
  vault_namespace: 'k8s-demo'
  roleName: 'k8s-demo'
  vaultKubernetesMountPath: 'kubernetes-demo'

service_account:
  serviceAccountName: 'deps-demo'
