agentic_ai:
  image:
    path: "/deps-platform/deps-agentic-ai"
  resources: {}


agentic_ai_settings:
  ENV: ins

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false


migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false


agentic_ai_consumer:
  image:
    path: "/deps-platform/deps-agentic-ai"


migrator:
  image:
    path: "/deps-platform/deps-agentic-ai-migrator"


helm:
  helm_logs_job_enabled: false


csi:
  vault_namespace: 'k8s-ins'
  roleName: 'k8s-ins'
  vaultKubernetesMountPath: 'kubernetes-ins'

service_account:
  serviceAccountName: 'deps-insurance'
